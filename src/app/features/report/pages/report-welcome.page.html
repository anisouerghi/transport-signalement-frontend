@if (loading()) {
  <section class="welcome panel p-4" aria-busy="true" aria-live="polite">
    <div class="skeleton mx-auto mb-3" style="height: 1.5rem; width: 70%"></div>
    <div class="skeleton mb-3" style="height: 7rem"></div>
    <div class="skeleton" style="height: 8rem"></div>
  </section>
} @else if (invalidQr()) {
  <section class="panel page-state">
    <div class="icon-wrap error"><i class="bi bi-qr-code-scan" aria-hidden="true"></i></div>
    <h1 class="h4">{{ 'welcome.invalidQr' | translate }}</h1>
    <p class="text-secondary mb-4">{{ errorMessage() }}</p>
    <a class="btn btn-transtu" routerLink="/signalement">{{ 'home.cta' | translate }}</a>
  </section>
} @else if (support(); as currentSupport) {
  <section class="welcome">
    <header class="welcome__hero text-center panel p-4 mb-3">
      <h1 class="h3 mb-2">{{ 'welcome.title' | translate }}</h1>
      <p class="text-secondary mb-0 welcome__intro">{{ 'welcome.intro' | translate }}</p>
    </header>

    <app-support-summary [support]="currentSupport" />
    <app-identity-choice [returnUrl]="formReturnUrl()" (continue)="goToForm()" />
  </section>
}
